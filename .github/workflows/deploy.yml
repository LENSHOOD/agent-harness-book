name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install publication dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Validate evidence ledger
        run: python publishing/scripts/audit_claim_ledger.py
      - name: Build book and PDF artifacts
        run: |
          python publishing/scripts/build_book.py
          python publishing/scripts/render_publications.py
      - name: Sync manuscript into the website
        run: python publishing/scripts/prepare_site.py
      - run: npm --prefix site ci
      - run: npm --prefix site run docs:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
